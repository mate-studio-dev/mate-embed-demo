<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mate Embed Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="editor">
<main>
  <aside>
    <nav class="tabs" aria-label="Demo mode">
      <a href="index.html" aria-current="page">Editor</a>
      <a href="gallery.html">Gallery</a>
      <a href="template.html">Template</a>
    </nav>
    <h1>Mate embed demo</h1>
    <p class="hint">
      This page's origin is <code id="own-origin"></code>.
      The iframe URL passes it as <code>host_origin</code>. The widget drops every message from any other origin.
    </p>

    <h2>Session</h2>
    <label for="create-response">Paste the create response (optional, fills the fields below)</label>
    <textarea id="create-response" placeholder='{"sessionId": "...", "contentUnitId": "...", "token": "...", ...}'></textarea>

    <label for="content-unit-id">contentUnitId</label>
    <input id="content-unit-id">
    <label for="token">Session token</label>
    <input id="token">
    <label for="session-expires-at">sessionExpiresAt (optional)</label>
    <input id="session-expires-at" placeholder="2026-10-03T09:00:00.000Z">
    <label for="locale">Locale</label>
    <select id="locale"><option>de</option><option>en</option></select>

    <h2>Endpoints</h2>
    <label for="app-url">Mate app URL</label>
    <input id="app-url" value="https://app.lvh.me">
    <label for="api-url">Mate API URL</label>
    <input id="api-url" value="https://api.lvh.me">

    <div class="row">
      <button class="primary" id="load">Load widget</button>
      <button id="unload">Unload</button>
    </div>
    <div id="status"></div>

    <h2>Refresh</h2>
    <label class="check"><input type="checkbox" id="auto-refresh" checked> Answer <code>refresh:requested</code> by calling the refresh API</label>
    <p class="hint">Turn it off to test the widget's 15 second timeout and the expired screen.</p>
    <div class="row">
      <button id="refresh-now">Refresh now</button>
      <button id="send-token">Send token:updated with the current token</button>
    </div>
  </aside>

  <section class="stage">
    <div class="size-bar">
      <span>Size</span>
      <button class="size-preset" data-width="" data-height="" data-default>Fill</button>
      <button class="size-preset" data-width="1280" data-height="800">Large 1280×800</button>
      <button class="size-preset" data-width="768" data-height="600">Medium 768×600</button>
      <label class="size-field">W <input id="width" type="number" min="100" step="10"></label>
      <label class="size-field">H <input id="height" type="number" min="100" step="10"></label>
    </div>
    <div class="viewport">
      <div id="frame-box">
        <span id="size-label"></span>
        <iframe id="widget" title="Mate widget"></iframe>
      </div>
    </div>
    <pre id="log"></pre>
  </section>
</main>

<script src="main.js"></script>
</body>
</html>
